<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Word Search 2</title>
    <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<link rel="stylesheet" href="./style.css">

    <style>
         @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');
                /**
        * Wordfind.js 0.0.1
        * (c) 2012 Bill, BunKat LLC.
        * Wordfind is freely distributable under the MIT license.
        * For all details and documentation:
        *     https://github.com/bunkat/wordfind
        */

        @font-face { 
        font-family: "slice"; 
        src: url("ROBOTOP.ttf") format("truetype");
        }

        h1 {
        font-size: 2rem;
        margin-bottom: 10px;
        margin-top: 20px;
        text-align: center;
        font-family: "slice", sans-serif;
        font-weight: 20;
        color: rgb(236, 232, 229);
        }

        body {
        background: rgb(10, 100, 153);
        }

        .puzzleWrap {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        width: 70%;
        margin: 0 auto;
        }

        p {
        font-size: 1rem;
        text-align: center;
        font-family: "Poppins", sans-serif;
        color: rgb(236, 232, 229);
        }

        p1 {
        font-size: 1rem;
        text-align: center;
        font-family: "Poppins", sans-serif;
        color: rgb(236, 232, 229);
        }

        /**
        * Styles for the puzzle
        */
        #puzzle {
        padding: 20px;
        align-self: center;
        outline: 1px dotted rgb(236, 232, 229);
        /* float: center; */
        margin:0 auto;
        width: auto;
        }

        /* style for each square in the puzzle */
        #puzzle .puzzleSquare {
        height: 30px;
        width: 30px;
        text-transform: uppercase;
        background-color: rgb(10, 100, 153);
        border: 0;
        
        font-family:  "Poppins", sans-serif;
        font-size: 16px;
        color:  rgb(236, 232, 229);
        }

        button::-moz-focus-inner {
        border: none;
        outline: none;
        }

        /* indicates when a square has been selected */
        #puzzle .selected {
        color: #e1a53c;
        outline: none;
        }
        #puzzle .selected:focus {
        border: none;
        }

        /* indicates that the square is part of a word that has been found */
        #puzzle .found {
        
        background-color: #218152;
        }

        #puzzle .solved {
        color:#e1a53c;
        }

        /* indicates that all words have been found 
        #puzzle .complete {
        background-color: green;
        } */

        /**
        * Styles for the word list
        */
       

        /* indicates that the word has been found */
        #words .wordFound {
        text-decoration: line-through;
        color: #b80d33;
        }

        /**
        * Styles for the button
        */
        #solve {
        margin: 30px 30px 0 40px;
        background: transparent;
        color: #b80d33;
        padding: 10px 20px;
        border: 2px solid #b80d33;
        border-radius: 25px;
        opacity: 0.5;
        transition: opacity 0.25s ease-in;
        }
        #solve:hover, #solve.gameSolved {
        opacity: 1;
        }

        #instructions {
        flex-grow: 1;
        text-align: justify;
        margin: 0;
        width: 70%;
        }



      @media (max-width: 400px){

            p {
            font-size: 1rem;
            text-align: center;
            font-family: "Poppins", sans-serif;
            margin-bottom: 10px;
            margin-top: 20px;
    
            }

            #puzzle .puzzleSquare {
            height: 30px;
            width: 30px;
            text-transform: uppercase;
            border: 0;
            font-family:  "Poppins", sans-serif;
            font-size: 1rem;
           
            }
        } 
    </style>
  </head>
    
  <body>
  <div class="puzzleWrap">
    <div>
    <h1>Word Search</h1>
    </div>

  <div id='puzzle'></div>


    <div id="instructions">
        <p1> Your next clue is <b>FEBRUARY...</b>  Reveal the word in this puzzle & text a screenshot of the solution to <b>(647) 691-5337</b> to win <b>two movie tickets</b> to a movie of your choice! </p1>
        

    </div>
    <div id="btn"><input id="okBtn" type="button" onclick="window.location.href='index.html'" value="Return Home"/> </div>
  
</div>
    <script src='//cdnjs.cloudflare.com/ajax/libs/jquery/2.2.2/jquery.min.js'></script><script  src="./script2.js"></script>

  </body>
  
</html>
